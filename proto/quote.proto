syntax = "proto3";

package quote;
option go_package = "bot/pb";

message Entity {
    string type = 1;
    int32 offset = 2;
    int32 length = 3;
}

message SerializableMessage {
    int32 grad_id = 1;
    string username = 2;
    optional string user_status = 3;
    optional string user_role = 4;
    string content = 5;
    repeated Entity entities = 6;
    bytes image = 7;
    int64 message_id = 8;
    int64 chat_id = 9;
    optional int32 dpi = 10;
    string theme = 11;
}

message ResultImage {
    bytes image = 1;
    int64 message_id = 2;
    int64 chat_id = 3;
}
