[package]
name = "generator_rs"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", features = ["webp"] }
parley = "0.11.1"
redis = { version = "1.7.0", features = ["tokio-comp"] }
tokio = { version = "1.53.1", features = ["full"] }
vello = { version = "0.10.0", features = ["wgpu"] }
zstd = "0.14.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.20"
serde_json = "1.0.150"
steel-core = "0.8.3"
taffy = "0.14.0"
async-channel = "2.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

