services:
  nats:
    container_name: nats
    image: docker.io/library/nats:alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - monitoring
  telegram-bot-api:
    container_name: telegram-bot-api
    hostname: telegram-bot-api
    build:
      context: ../extern/telegram-bot-api
      args:
        TARGETARCH: amd64
    command:
      - --http-port=8081
      - --http-stat-port=8082
    networks:
      - monitoring
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_MAX_PENDING_UPDATES=10000
    volumes:
      - telegram-bot-api-data:/data
    ports:
      - "8081:8081"
      - "8082:8082"
    restart: unless-stopped

  bot:
    container_name: telegram-bot
    hostname: telegram-bot
    networks:
      - monitoring
    build:
      context: ../services/bot
      dockerfile: Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    environment:
      - BOT_TOKEN
      - BOT_API_URL=http://telegram-bot-api:8081
      - NATS_URL=nats://nats:4222
      - LOG_LVL
      - LOG_PATH
    ports:
      - "8000:8000"
    volumes:
      - ../services/logs:/app/logs
      - telegram-bot-api-data:/data:ro

  generator:
    container_name: generator
    hostname: generator
    networks:
      - monitoring
    build:
      context: ../services/generator/
      dockerfile: Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - NATS_URL=nats://nats:4222
      - TEMPLATE
      - DPI
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ../services/generator/templates:/app/templates
    restart: unless-stopped



networks:
  monitoring:

volumes:
  telegram-bot-api-data:
