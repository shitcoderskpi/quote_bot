services:
  nats:
    container_name: nats
    image: nats:alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - monitoring
  bot:
    container_name: telegram-bot
    hostname: telegram-bot
    networks:
      - monitoring
    build:
      context: ../services/bot
      dockerfile: Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - BOT_TOKEN
      - NATS_URL=nats://nats:4222
      - LOG_LVL
      - LOG_PATH
    ports:
      - "8000:8000"
    volumes:
      - ../services/logs:/app/logs

  generator:
    container_name: generator
    hostname: generator
    networks:
      - monitoring
    build:
      context: ../services/generator/
      dockerfile: Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - NATS_URL=nats://nats:4222
      - TEMPLATE
      - DPI
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ../services/generator/templates:/app/templates
    restart: unless-stopped



networks:
  monitoring:
