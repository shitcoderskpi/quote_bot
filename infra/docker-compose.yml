services:
  redis:
    container_name: redis
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - monitoring
  bot:
    container_name: telegram-bot
    hostname: telegram-bot
    networks:
      - monitoring
    build:
      context: ../services/bot
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - BOT_TOKEN
      - REDIS_HOST
      - LOG_LVL
      - LOG_PATH
    ports:
      - "8000:8000"
    volumes:
      - ../services/logs:/app/logs

  generator:
    container_name: generator
    hostname: generator
    networks:
      - monitoring
    build:
      context: ../services/generator/
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - REDIS_HOST
      - TEMPLATE
      - DPI
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ../services/generator/templates:/app/templates
    restart: unless-stopped



networks:
  monitoring: